
name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Build and Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Select iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True
          ))

          iphones = [
              device
              for devices in data["devices"].values()
              for device in devices
              if device["name"].startswith("iPhone")
              and device.get("isAvailable", True)
          ]

          if not iphones:
              raise SystemExit("No available iPhone simulator")

          print(f"udid={iphones[0]['udid']}")
          PY

      - name: Run XCTest
        run: |
          set -o pipefail

          xcodebuild test \
            -project CurrencyExchange.xcodeproj \
            -scheme CurrencyExchange \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
