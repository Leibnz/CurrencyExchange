included:
  - CurrencyExchange
  - CurrencyExchangeTests

excluded:
  - Pods
  - .build
  - DerivedData

disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - empty_count
  - force_unwrapping

line_length:
  warning: 120
  error: 160

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 700

function_body_length:
  warning: 50
  error: 80

identifier_name:
  min_length: 2
  max_length: 50
